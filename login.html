{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="auth"><div class="card auth-card">
  <h1>Welcome back</h1>
  <p class="muted">Sign in to access your planners and saved recommendations.</p>
  {% if message %}<div class="alert alert-ok">{{ message }}</div>{% endif %}
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label>Username<input name="username" required autofocus></label>
    <label>Password<input type="password" name="password" required></label>
    <button class="btn btn-primary btn-block" type="submit">Sign In</button>
  </form>
  <p class="center muted">New here? <a href="/register">Create an account</a></p>
</div></section>
{% endblock %}
